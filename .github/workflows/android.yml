name: Built Android APK compiler

on:
  push:
    branches: [ "main", "master", "development", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Decode or Generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          echo "Decoding existing debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "debug.keystore.base64 not found. Dynamically generating a self-signed debug.keystore on the fly..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype JKS
        fi

    - name: Build Signed APK & Play Store Bundle (AAB) with Gradle
      run: gradle copyReleaseBuildsToOutputs --no-daemon
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: StudyFocus-Release-APK
        path: release-files/app-release-signed.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Play Store Bundle (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: StudyFocus-PlayStore-Bundle-AAB
        path: release-files/app-release-signed.aab
        if-no-files-found: error
        retention-days: 14
